# ====================================================================
# Nudge Calibration Probe Configuration (M3-STOP / PF2)
# ====================================================================

[tools_calibrate]
pin: ^PF2
travel_speed: 20
spread: 3.5
lower_z: 1.0
speed: 2
lift_speed: 4
final_lift_z: 6
sample_retract_dist: 2
samples_tolerance: 0.05
samples: 3
samples_result: median

# Convenient macro to test/query Nudge trigger state from Mainsail / console
[gcode_macro QUERY_NUDGE]
description: Query trigger state of the Nudge calibration probe
gcode:
    TOOL_CALIBRATE_QUERY_PROBE
