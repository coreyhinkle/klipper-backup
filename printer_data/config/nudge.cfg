# ====================================================================
# NUDGE MULTI-AXIS TOOL CALIBRATION & OFFSET SUITE
# ====================================================================
# Hardware: Nudge 3-axis mechanical probe on Manta M8P V2.0 M3-STOP (PF2)
# Ecosystem: KTC-Easy (klipper-toolchanger-easy)

[tools_calibrate]
pin: ^PF2
travel_speed: 20          # Speed (mm/s) to travel sideways for XY probing
spread: 3.5               # Over-travel clearance around pin (for 3-5mm pins)
lower_z: 1.0              # Depth (mm) to plunge below pin top for XY touches
speed: 2.0                # Probe plunge speed (mm/s)
lift_speed: 4.0           # Z retract speed (mm/s)
final_lift_z: 6.0         # Clearance height after probing completes
sample_retract_dist: 2.0  # Retract distance between sample taps
samples: 3                # Number of samples per touch point
samples_result: median    # median or average
samples_tolerance: 0.05
trigger_to_bottom_z: 0.25 # Vertical distance from switch trigger to bottom-out


# ====================================================================
# CONFIGURATION VARIABLES & COORDINATES
# ====================================================================
# Once your mount is installed, jog Tool 0 directly centered ~2-5mm above 
# the pin, then update variable_x, variable_y, variable_z below (or run SET_NUDGE_POSITION).

[gcode_macro _CALIBRATION_SWITCH]
variable_x: 0.0                 # Target pin center X (Set once mounted)
variable_y: 0.0                 # Target pin center Y (Set once mounted)
variable_z: 25.0                # Safe transit / approach height above bed
variable_configured: False      # Safety guard: set to True once coordinates are measured
variable_use_dock_switch: False # Set to True when endstop switch is installed
gcode:
    RESPOND MSG="Nudge target: X={printer['gcode_macro _CALIBRATION_SWITCH'].x} Y={printer['gcode_macro _CALIBRATION_SWITCH'].y} Z={printer['gcode_macro _CALIBRATION_SWITCH'].z}"


# ====================================================================
# DOCK / PRESENCE SWITCH HOOK (OPTIONAL)
# ====================================================================
# When you find an endstop switch for dock presence (e.g. on M4-STOP / PF1),
# uncomment the section below and set variable_use_dock_switch: True above.

#[gcode_button nudge_dock_sensor]
#pin: ^!PF1
#press_gcode:
#    RESPOND MSG="Nudge: Confirmed ENGAGED"
#release_gcode:
#    RESPOND MSG="Nudge: Confirmed DISENGAGED"


# ====================================================================
# DIAGNOSTIC & POSITIONING MACROS
# ====================================================================

[gcode_macro QUERY_NUDGE]
description: Check the live trigger state of the Nudge probe
gcode:
    TOOL_CALIBRATE_QUERY_PROBE

[gcode_macro SET_NUDGE_POSITION]
description: Store current toolhead position as the Nudge target: SET_NUDGE_POSITION or SET_NUDGE_POSITION X=... Y=... Z=...
gcode:
    {% set cur_x = params.X|default(printer.toolhead.position.x)|float %}
    {% set cur_y = params.Y|default(printer.toolhead.position.y)|float %}
    {% set cur_z = params.Z|default(printer.toolhead.position.z)|float %}
    SET_GCODE_VARIABLE MACRO=_CALIBRATION_SWITCH VARIABLE=x VALUE={cur_x}
    SET_GCODE_VARIABLE MACRO=_CALIBRATION_SWITCH VARIABLE=y VALUE={cur_y}
    SET_GCODE_VARIABLE MACRO=_CALIBRATION_SWITCH VARIABLE=z VALUE={cur_z}
    SET_GCODE_VARIABLE MACRO=_CALIBRATION_SWITCH VARIABLE=configured VALUE=True
    RESPOND MSG="Nudge position saved: X={cur_x|round(3)} Y={cur_y|round(3)} Z={cur_z|round(3)} (Configured: True)"

[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
description: Safely position active toolhead directly above the Nudge sensor pin
gcode:
    {% set nudge = printer["gcode_macro _CALIBRATION_SWITCH"] %}
    {% if not nudge.configured %}
        { action_raise_error("Nudge coordinates are not configured yet! Jog over the pin and run SET_NUDGE_POSITION.") }
    {% endif %}
    {% if nudge.use_dock_switch %}
        {% if printer["gcode_button nudge_dock_sensor"].state != "PRESSED" %}
            { action_raise_error("Nudge presence switch is not triggered! Ensure Nudge is mounted/engaged.") }
        {% endif %}
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("Printer is not homed! Run G28 first.") }
    {% endif %}

    BED_MESH_CLEAR
    G90
    # Raise to safe clearance height first
    G0 Z{ [printer.toolhead.position.z, nudge.z]|max } F6000
    # Move directly over sensor pin
    G0 X{nudge.x} Y{nudge.y} F12000
    # Lower to approach height
    G0 Z{nudge.z} F3000


# ====================================================================
# FULL MULTI-TOOL OFFSET CALIBRATION ROUTINES
# ====================================================================

[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Automatically calibrate XYZ offsets for all tools against reference T0
gcode:
    {% set nudge = printer["gcode_macro _CALIBRATION_SWITCH"] %}
    {% if not nudge.configured %}
        { action_raise_error("Nudge coordinates are not configured! Jog over the pin and run SET_NUDGE_POSITION first.") }
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    {% set tools = printer.toolchanger.tool_numbers %}
    {% set names = printer.toolchanger.tool_names %}
    {% set clean_temp = params.TEMP|default(150)|float %}

    M117 Preheating nozzles to {clean_temp}C...
    {% for tool in tools %}
        M104 S{clean_temp} T{tool}
    {% endfor %}

    # Select Master Reference Tool 0
    M117 Calibrating Reference Tool T0...
    SELECT_TOOL T={tools[0]} RESTORE_AXIS=XYZ
    STOP_TOOL_PROBE_CRASH_DETECTION
    CALIBRATE_MOVE_OVER_PROBE
    TEMPERATURE_WAIT SENSOR='{printer.toolhead.extruder}' MINIMUM={clean_temp}
    
    # Establish pin center & Z datum using Tool 0
    TOOL_LOCATE_SENSOR
    M104 S0 T={tools[0]}

    # Measure and store relative offsets for all secondary tools
    {% for tool in tools[1:] %}
        M117 Calibrating Tool T{tool}...
        SELECT_TOOL T={tool} RESTORE_AXIS=Z
        STOP_TOOL_PROBE_CRASH_DETECTION
        CALIBRATE_MOVE_OVER_PROBE
        TEMPERATURE_WAIT SENSOR='{printer[names[loop.index]].extruder}' MINIMUM={clean_temp}
        TOOL_CALIBRATE_TOOL_OFFSET
        _SAVE_TOOL_OFFSET T={tool}
        M104 S0 T={tool}
    {% endfor %}

    # Return to T0 and park safely
    M117 Offset calibration complete!
    SELECT_TOOL T={tools[0]} RESTORE_AXIS=XZ
    TURN_OFF_HEATERS
    RESPOND MSG="All tool offsets calibrated and saved successfully."

[gcode_macro CALIBRATE_SINGLE_TOOL_OFFSET]
description: Calibrate offsets for a specific secondary tool: CALIBRATE_SINGLE_TOOL_OFFSET TOOL=1
gcode:
    {% set target_tool = params.TOOL|default(1)|int %}
    {% if target_tool == 0 %}
        { action_raise_error("Tool 0 is the reference tool. Offsets are measured for secondary tools (e.g. TOOL=1).") }
    {% endif %}
    {% set clean_temp = params.TEMP|default(150)|float %}

    # 1. Establish reference with T0
    SELECT_TOOL T=0 RESTORE_AXIS=XYZ
    STOP_TOOL_PROBE_CRASH_DETECTION
    M109 S{clean_temp} T0
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR
    M104 S0 T0

    # 2. Calibrate requested secondary tool
    SELECT_TOOL T={target_tool} RESTORE_AXIS=Z
    STOP_TOOL_PROBE_CRASH_DETECTION
    M109 S{clean_temp} T{target_tool}
    CALIBRATE_MOVE_OVER_PROBE
    TOOL_CALIBRATE_TOOL_OFFSET
    _SAVE_TOOL_OFFSET T={target_tool}
    M104 S0 T{target_tool}

    SELECT_TOOL T=0 RESTORE_AXIS=XZ
    TURN_OFF_HEATERS
    RESPOND MSG="Tool T{target_tool} offset calibrated and saved."

[gcode_macro _SAVE_TOOL_OFFSET]
description: Internal helper to save offsets into toolchanger runtime parameters
gcode:
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_x_offset VALUE="{printer.tools_calibrate.last_x_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_x_offset
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_y_offset VALUE="{printer.tools_calibrate.last_y_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_y_offset
    SET_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset VALUE="{printer.tools_calibrate.last_z_result}"
    SAVE_TOOL_PARAMETER T={params.T} PARAMETER=gcode_z_offset
    RESPOND MSG="Saved T{params.T} offsets: X={printer.tools_calibrate.last_x_result|round(4)} Y={printer.tools_calibrate.last_y_result|round(4)} Z={printer.tools_calibrate.last_z_result|round(4)}"
