[homing_override]
axes: xyz
gcode:
  INITIALIZE_TOOLCHANGER
  M117 Homing......
  STATUS_HOMING
  STOP_TOOL_PROBE_CRASH_DETECTION
  {% if printer.probe.last_query %}
         RESPOND TYPE=echo MSG='Z Probe triggered, cannot home.'
  {% else %}
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    {% if home_all %}
      G90 ; absolute mode
      G28 Z
      G0 Z10 F1000
    {% endif %}

    {% if home_all or 'Y' in params or 'X' in params %}
      G28 Y
    {% endif %}

    {% if home_all or 'X' in params %}
      G90 ; absolute mode
      G0 Y{ max_y - 20 } F5000
      _SENSORLESS_HOME_X
      G91 ; relative mode
      G0 X-10 F5000
    {% endif %}

    {% if home_all or 'Z' in params %}
      {% set random_x = (range(-50, 50) | random) / 10 %}
      {% set random_y = (range(-50, 50) | random) / 10 %}

      G90 ; absolute mode
      G0 X{175.0+random_x} Y{175.0+random_y} F12000
      G28 Z
      _ADJUST_Z_HOME_FOR_TOOL_OFFSET
    {% endif %}
    G90 ; Ensure absolute mode after homing
    M400
    STATUS_READY
  {% endif %}


[gcode_macro _SENSORLESS_HOME_X]
variable_home_current: 0.5
gcode:
    # Always use consistent run_current on A/B steppers during sensorless homing
    {% set RUN_CURRENT_X = printer.configfile.settings['tmc2209 stepper_x'].run_current|float %}
    {% set RUN_CURRENT_Y = printer.configfile.settings['tmc2209 stepper_y'].run_current|float %}
    {% set HOME_CURRENT = printer["gcode_macro _SENSORLESS_HOME_X"].home_current|float %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CURRENT}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CURRENT}

    # Home
    G28 X
    # Move away
    G91
    G1 X-10 F1200
    
    # Wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    # Set current during print
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CURRENT_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CURRENT_Y}

; Depending on the selected tool at the time of homing, the physical Z endstop position is offset.
; This corrects for that using current tool gcode_z_offset.
; Note: In Klipper v0.13.0-800+ (commit 5cbebdc3) and klipper-toolchanger PR #174 (commit 0bded50),
; G28 Z via probe:z_virtual_endstop already applies the active tool probe's z_offset automatically.
; Only the tool's gcode_z_offset needs to be applied via ADJUST_Z_AFTER_TOOL_NOZZLE_HOME.
[gcode_macro _ADJUST_Z_HOME_FOR_TOOL_OFFSET]
gcode:
      G90 ; absolute mode
      ADJUST_Z_AFTER_TOOL_NOZZLE_HOME
      G0 Z10 F1000

[gcode_macro TOOL_BED_MESH_CALIBRATE]
gcode:
      STATUS_MESHING
      M117 Calibrating mesh........
      {% set tool_z_offset = printer[printer.toolchanger.tool].gcode_z_offset|float %}
      G90 ; absolute mode
      G0 Z10 F1000
      # Bed mesh knows about the probe offset, but not about the tool gcode_z_offset.
      # Only shift kinematic Z if meshing with a non-zero gcode_z_offset tool,
      # and restore relative to toolhead.position.z so the active mesh offset is preserved.
      {% if tool_z_offset != 0.0 %}
        SET_KINEMATIC_POSITION Z={printer.toolhead.position.z - tool_z_offset}
      {% endif %}
      BED_MESH_CALIBRATE ADAPTIVE=1
      G0 Z10 F1000
      {% if tool_z_offset != 0.0 %}
        SET_KINEMATIC_POSITION Z={printer.toolhead.position.z + tool_z_offset}
      {% endif %}
      STATUS_READY
