[gcode_macro TOOLCHANGE_DEMO]
gcode:
    {% for n in range(20) %}
      T{ printer.toolchanger.tool_numbers | random }
    {% endfor %}

[gcode_macro G32]
gcode:
    STATUS_LEVELING                   #LED Status Color
    BED_MESH_CLEAR
    QUAD_GANTRY_LEVEL
    G28 Z

[gcode_macro PRINT_STATUS]
gcode: 
  RESPOND TYPE='echo' MSG="Status for M190 {params.OBJ} is { printer[params.OBJ] }"
#python:
#  gcode.RESPOND(TYPE='echo', MSG=f"Status for M190 {params.OBJ} is { printer[params.OBJ] }")

[gcode_macro _PARK_ON_COOLING_PAD]
gcode:
  G90 ; Absolute positioning
  G0 X118 Y-4.5 Z5 F5000
  G0 Z0 F600

[gcode_macro _CLEAN_NOZZLE]
description: Clean nozzle on nozzle cleaning pad.
gcode:
  G90
  RESPOND TYPE=echo MSG="Cleaning nozzle"
  {% set heater =  printer.toolhead.extruder %}
  M104 S{params.TEMP}
  
  G0 X160 Y100 F5000
  G0 X160 Y-4.5 Z5 F5000
  TEMPERATURE_WAIT SENSOR={heater} MINIMUM={params.TEMP}
  M104 S0 # Set temp to 0
  G0 Z0.5
  G0 X120 F5000
  G0 X155 F5000
  G0 X124 F5000
  G0 X121 F5000
  G0 X118 Z1 F5000
  G0 Z0 F600
  TEMPERATURE_WAIT SENSOR={heater} MAXIMUM=120
  G0 Z20
  G0 Y20

[gcode_macro _WIPE_NOZZLE]
description: Wipe the nozzle on the pad
gcode:
  G90     
  G0 X160 Y-4.5 Z5 F5000
  G0 Z0.5
  G0 X120 F5000
  G0 X155 F5000
  G0 X124 F5000
  G0 X121 F5000
  G0 X118 Z1 F5000
  G0 Z-0.3 F60
  G0 Z5 F600


[gcode_macro UNSAFE_LOWER_BED]
description: Lower the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=100
  G0 Z0 F600
  M84

[gcode_macro UNSAFE_RAISE_BED]
description: Raise the bed 100mm without homing
gcode:
  G90
  SET_KINEMATIC_POSITION Z=0
  G0 Z100 F600
  M84

[gcode_macro _TAP_PROBE_ACTIVATE]
description: Ensure safe temp for bed probing
gcode:
    {% set max_temp = 150 %}
    {% set actual_temp = printer[params.HEATER].temperature %}
    {% set target_temp = printer[params.HEATER].target %}
    {% if target_temp > max_temp %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (target_temp, max_temp)) }
        SET_HEATER_TEMPERATURE HEATER={params.HEATER} TARGET={ max_temp|int - 5 }
    {% endif %}
    # Temperature target is already low enough, but nozzle may still be too hot.
    {% if actual_temp > max_temp  + 2 %}
        { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (actual_temp, max_temp)) }
        TEMPERATURE_WAIT SENSOR={params.HEATER} MAXIMUM={ max_temp }
    {% endif %}


[gcode_macro PRINT_START]
variable_printing: False
gcode:
  M140 S{ params.BED_TEMP }

  M117 initializing  
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
  INITIALIZE_TOOLCHANGER
  G28
  M117 Cleaning the nozzle
  #_CLEAN_NOZZLE TEMP={ params.TOOL_TEMP|int - 30 }

  M117 Heating up the bed
  # TEMPERATURE_WAIT SENSOR="temperature_fan buildplate" MINIMUM={ [ params.BED_TEMP|float * 0.94, params.BED_TEMP|float - 6.0 ] |min }
  M190 S{ params.BED_TEMP }

  M109 S150 ; Heat up nozzle to soften any leftover filament for homing.
  M117 Leveling gantry........
  G32
  M117 Calibrating mesh........
  TOOL_BED_MESH_CALIBRATE
  M109 S0 # Stop to heat, the actual printing may happen with a different hotend.

  M117 Heating up the hotends...
  STATUS_HEATING
  # Preheat all the hotends in use
  {% for tool_nr in printer.toolchanger.tool_numbers %}
    {% set tooltemp_param = 'T' ~ tool_nr|string ~ '_TEMP' %}
    {% if tooltemp_param in params %}
      M104 T{tool_nr} S{params[tooltemp_param]}
    {% endif %}
  {% endfor %}

  #_PARK_ON_COOLING_PAD
  {% if params.TOOL is defined %}
    T{params.TOOL}
  {% endif %}

  M109 S{ params.TOOL_TEMP }
  G0 Z2 F300 ;Move up a bit
  G92 E0 ; Zero extruder
  START_TOOL_PROBE_CRASH_DETECTION
  SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=True
  LINE_PURGE
  STATUS_PRINTING
  M117 Printing!

[gcode_macro PRINT_END]
gcode:
    STOP_TOOL_PROBE_CRASH_DETECTION
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=printing VALUE=False
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-4.0 F3600                 ; retract filament

    G91                            ; relative positioning
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 20) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    G0 X{x_safe} Y{y_safe} F20000  ; move nozzle to remove stringing
    G0 Z{z_safe} F3600             ; move nozzle up

    TURN_OFF_HEATERS
    M107                           ; turn off fan
    M140                           ; turn off bed

    G90                            ; absolute positioning
    {% set park_z = [printer.toolhead.position.z|float, 100.0]|max %}
    G0 X175 Y300 Z{ [park_z, max_z]|min } F3600 ; park nozzle safely at rear away from docks
    BED_MESH_CLEAR
    M18                            ; Motors off
    M117 Print done
    STATUS_OFF

[gcode_macro LOAD_FILAMENT]
description: Safely heat and load filament into the active or specified toolhead
gcode:
  {% set is_paused = printer.pause_resume.is_paused|default(false) %}
  {% set tool_idx = params.TOOL|default(printer.toolchanger.tool_number)|int %}
  {% if tool_idx < 0 %}{% set tool_idx = 0 %}{% endif %}
  {% set tool_name = printer.toolchanger.tool_names[tool_idx] %}
  {% set extruder = printer[tool_name].extruder %}
  {% set current_target = printer[extruder].target|default(0)|int %}
  {% set default_temp = current_target if current_target >= 190 else 230 %}
  {% set temp = params.TEMP|default(default_temp)|int %}
  {% set dist = params.DISTANCE|default(80)|float %}

  M117 Loading T{tool_idx}...
  # Only move toolhead to front-center if completely idle (NOT during a print pause!)
  {% if not is_paused and xyz in printer.toolhead.homed_axes %}
    G90
    {% set safe_z = [printer.toolhead.position.z|float, 50.0]|max %}
    G1 Z{safe_z} F3000
    G1 X175 Y50 F6000
  {% endif %}

  # Heat extruder if below target
  {% if printer[extruder].temperature < temp - 2 %}
    M117 Heating T{tool_idx} to {temp}C
    M104 T{tool_idx} S{temp}
    TEMPERATURE_WAIT SENSOR={extruder} MINIMUM={temp}
  {% endif %}

  ACTIVATE_EXTRUDER EXTRUDER={extruder}
  M83                           ; relative extrusion
  G1 E{dist * 0.7} F400         ; fast feed
  G1 E{dist * 0.3} F180         ; slow purge into nozzle
  G1 E-2 F1800                  ; slight anti-ooze retract
  M82                           ; absolute extrusion
  M400

  # Only turn off hotend if printer was NOT paused mid-print
  {% if not is_paused and current_target < 190 %}
    M104 T{tool_idx} S0
  {% endif %}
  M117 T{tool_idx} Loaded

[gcode_macro UNLOAD_FILAMENT]
description: Safely unload filament with tip-shaping without turning off the bed
gcode:
  {% set is_paused = printer.pause_resume.is_paused|default(false) %}
  {% set tool_idx = params.TOOL|default(printer.toolchanger.tool_number)|int %}
  {% if tool_idx < 0 %}{% set tool_idx = 0 %}{% endif %}
  {% set tool_name = printer.toolchanger.tool_names[tool_idx] %}
  {% set extruder = printer[tool_name].extruder %}
  {% set current_target = printer[extruder].target|default(0)|int %}
  {% set default_temp = current_target if current_target >= 190 else 230 %}
  {% set temp = params.TEMP|default(default_temp)|int %}
  {% set is_docked = (printer.toolchanger.tool_number != tool_idx) %}

  M117 Unloading T{tool_idx}...

  # Heat extruder if below target
  {% if printer[extruder].temperature < temp - 2 %}
    M117 Heating T{tool_idx} to {temp}C
    M104 T{tool_idx} S{temp}
    TEMPERATURE_WAIT SENSOR={extruder} MINIMUM={temp}
  {% endif %}

  ACTIVATE_EXTRUDER EXTRUDER={extruder}
  M83                           ; relative extrusion

  # Tip shaping: Only forward-purge if toolhead is NOT sitting in its dock!
  {% if not is_docked %}
    G1 E3 F300                  ; push 3mm forward to melt tip evenly
  {% endif %}

  # Fast snap retract to break string in heatbreak
  G1 E-15 F3000
  # Cooling pause for tip to solidify into a clean cylinder
  G4 P2000
  # Smooth pull through extruder gears
  G1 E-45 F1000
  G1 E-40 F1000
  M82                           ; absolute extrusion
  M400

  # Turn off only THIS tool hotend; NEVER turn off the heated bed!
  {% if not is_paused %}
    M104 T{tool_idx} S0
  {% endif %}
  M117 T{tool_idx} Unloaded

[gcode_macro UNLOAD_ONE_FILAMENT]
description: Unload a specific toolhead (e.g. UNLOAD_ONE_FILAMENT TOOL=1)
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  UNLOAD_FILAMENT TOOL={tool} TEMP={params.TEMP|default(230)}

[gcode_macro UNLOAD_ALL_FILAMENT]
description: Unload all toolheads safely without extruding into docks or dropping bed temp
gcode:
  {% set temp = params.TEMP|default(230)|int %}
  {% set tools = printer.toolchanger.tool_names %}
  M117 Heating all tools for unload...
  {% for tool in tools %}
    M104 T{printer[tool].tool_number} S{temp}
  {% endfor %}
  {% for tool in tools %}
    UNLOAD_FILAMENT TOOL={printer[tool].tool_number} TEMP={temp}
  {% endfor %}
  M117 All tools unloaded

[gcode_macro CHANGE_NOZZLE]
gcode:
  M117 Nozzle change
  M104 S240
  G90 ; Absolute pos
  G1 X175 Y0 Z100 F1800 ; Move to front
  M109 S240 ;Heat up the filament
  M83                            ; set extruder to relative
  G1 E5 F250                   ; extrude 5 mm
  G1 E-50 F1000                ; retract 5 cm
  M82                            ; set extruder to absolute
  M117 Ready to swap

