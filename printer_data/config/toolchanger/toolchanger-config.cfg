# User-editable toolchanger configuration and parameter overrides

[rounded_path]
resolution: 0.2
replace_g0: False

[force_move]
enable_force_move: True

[toolchanger]
# Tuned DraftChange front enclosure clearance and rapid docking transit
params_safe_y: 90
params_close_y: 35
params_fast_speed: 15000
params_path_speed: 900
params_dropoff_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4, 'verify':1}]
require_tool_present: True

[gcode_macro homing_override_config]
variable_sensorless_x: True
variable_sensorless_y: False
variable_homing_rebound_y: 20
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.50

[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
variable_default_deadband: 4.0

[gcode_macro _TAP_PROBE_ACTIVATE]
description: Ensure nozzle is at a reasonable temperature for bed probing
gcode:
    {% set temp = params.TEMP|default(150)|float %}
    {% set actual_temp = printer[params.HEATER].temperature %}
    {% set target_temp = printer[params.HEATER].target %}

    # If the nozzle is too hot or set to a higher temperature than probe temp, lower to probe temp and wait to cool
    {% if actual_temp > (temp + 2) or target_temp > temp %}
        { action_respond_info('Extruder temperature %.1fC is too high, lowering to %.1fC and waiting' % (actual_temp, temp)) }
        SET_HEATER_TEMPERATURE HEATER={params.HEATER} TARGET={temp|int}
        TEMPERATURE_WAIT SENSOR={params.HEATER} MAXIMUM={temp + 1.5}
    # If the target is not set or below probe temp, heat up to probe temp and wait
    {% elif target_temp < temp %}
        { action_respond_info('Extruder temperature target %.1fC is below probe temp %.1fC, heating and waiting' % (target_temp, temp)) }
        SET_HEATER_TEMPERATURE HEATER={params.HEATER} TARGET={temp|int}
        TEMPERATURE_WAIT SENSOR={params.HEATER} MINIMUM={temp - 1.0}
    {% endif %}

