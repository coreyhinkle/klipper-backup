# User-editable toolchanger configuration and parameter overrides

[rounded_path]
resolution: 0.2
replace_g0: False

[force_move]
enable_force_move: True

[toolchanger]
# Tuned DraftChange front enclosure clearance and rapid docking transit
params_safe_y: 90
params_close_y: 35
params_fast_speed: 15000
params_path_speed: 600
params_dropoff_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4}]
require_tool_present: True

[gcode_macro homing_override_config]
variable_sensorless_x: True
variable_sensorless_y: False
variable_homing_rebound_y: 20
variable_stepper_driver: tmc2209
variable_homing_current: 0.50
