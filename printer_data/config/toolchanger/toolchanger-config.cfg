# User-editable toolchanger configuration and parameter overrides

[rounded_path]
resolution: 0.2
replace_g0: False

[force_move]
enable_force_move: True

[toolchanger]
# Tuned DraftChange front enclosure clearance and rapid docking transit
params_safe_y: 90
params_close_y: 35
params_fast_speed: 15000
params_path_speed: 900
params_dropoff_path: [{'y':9.5 ,'z':4}, {'y':9.5, 'z':2}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-10, 'y':0}, {'z':-10, 'y':16}]
params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4}]
require_tool_present: True

[gcode_macro homing_override_config]
variable_sensorless_x: True
variable_sensorless_y: False
variable_homing_rebound_y: 20
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.50

[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
variable_default_deadband: 4.0

[gcode_macro VERIFY_TOOL_DETECTED]
gcode:
    M400
    G4 P200
    DETECT_ACTIVE_TOOL_PROBE
    _STOP_IF_INCORRECT_TOOL {rawparams}

[gcode_macro _STOP_IF_INCORRECT_TOOL]
gcode:
    {% if 'T' in params and printer.tool_probe_endstop.active_tool_number | int != params.T | int %}
       RESPOND TYPE=error MSG='Tool not detected, expected {params.T}. Pausing the print.'
       PAUSE
    {% elif printer.tool_probe_endstop.active_tool_number | int == -1 %}
       RESPOND TYPE=error MSG='No tool detected. Pausing the print.'
       PAUSE
    {% endif %}


# ====================================================================
# NUDGE MULTI-AXIS TOOL CALIBRATION SWITCH & SENSOR
# ====================================================================
# Hardware: Nudge 3-axis mechanical probe on Manta M8P V2.0 M3-STOP (PF2)
# Ecosystem: KTC-Easy (klipper-toolchanger-easy)

[gcode_macro _CALIBRATION_SWITCH]
variable_x: 89.5                # Target pin center X (Measured)
variable_y: 335.0               # Target pin center Y (Measured)
variable_z: 37.0                # Safe transit / approach height (~2.8mm above pin top @ 34.22)
variable_configured: True       # Safety guard: unlocked
variable_use_dock_switch: False # Set to True when endstop switch is installed
gcode:
    RESPOND MSG="Nudge target: X={printer['gcode_macro _CALIBRATION_SWITCH'].x} Y={printer['gcode_macro _CALIBRATION_SWITCH'].y} Z={printer['gcode_macro _CALIBRATION_SWITCH'].z}"

[tools_calibrate]
pin: ^PF2
travel_speed: 20          # Speed (mm/s) to travel sideways for XY probing
spread: 6.0               # Over-travel clearance around pin (tuned for nozzle cone + wobbler)
lower_z: 1.0              # Depth (mm) to plunge below pin top for XY touches
lift_z: 3.0               # Retract height between XY probe moves to clear pin
speed: 2.0                # Probe plunge speed (mm/s)
lift_speed: 4.0           # Z retract speed (mm/s)
final_lift_z: 6.0         # Clearance height after probing completes
sample_retract_dist: 2.0  # Retract distance between sample taps
samples: 3                # Number of samples per touch point
samples_result: median    # median or average
samples_tolerance: 0.05
samples_tolerance_retries: 2 # Retries to absorb mechanical settling across directional touches
trigger_to_bottom_z: 0.25 # Vertical distance from switch trigger to bottom-out
max_travel: 5.0           # Safety clamp: maximum plunge distance before aborting

[gcode_macro QUERY_NUDGE]
description: Check the live trigger state of the Nudge probe
gcode:
    TOOL_CALIBRATE_QUERY_PROBE

[gcode_macro SET_NUDGE_POSITION]
description: Store current toolhead position as the Nudge target: SET_NUDGE_POSITION or SET_NUDGE_POSITION X=... Y=... Z=...
gcode:
    {% set cur_x = params.X|default(printer.toolhead.position.x)|float %}
    {% set cur_y = params.Y|default(printer.toolhead.position.y)|float %}
    {% set cur_z = params.Z|default(printer.toolhead.position.z)|float %}
    SET_GCODE_VARIABLE MACRO=_CALIBRATION_SWITCH VARIABLE=x VALUE={cur_x}
    SET_GCODE_VARIABLE MACRO=_CALIBRATION_SWITCH VARIABLE=y VALUE={cur_y}
    SET_GCODE_VARIABLE MACRO=_CALIBRATION_SWITCH VARIABLE=z VALUE={cur_z}
    SET_GCODE_VARIABLE MACRO=_CALIBRATION_SWITCH VARIABLE=configured VALUE=True
    RESPOND MSG="Nudge position saved: X={cur_x|round(3)} Y={cur_y|round(3)} Z={cur_z|round(3)} (Configured: True)"


