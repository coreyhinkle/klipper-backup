# T2 (Cyan) - Dragon Burner on BIGTREETECH EBB36 v1.2 (STM32G0B1)
# Firmware: Katapult (8KiB, CAN PB0/PB1 @ 1Mbps) + Klipper (8KiB offset, CAN PB0/PB1 @ 1Mbps)
# Pin reference: ~/klipper/config/sample-bigtreetech-ebb-canbus-v1.2.cfg
#
# =====================================================================
# TODO BEFORE FULL TOOLCHANGER INTEGRATION:
#   [x] Run PID calibration now that hotend cowl/chamber is assembled:
#       Calibrated @ 240C: pid_Kp=40.092, pid_Ki=13.364, pid_Kd=30.069
#   [x] Uncomment [gcode_macro T2] and [tool T2] and verify OptoTap
#       200-sample repeatability (0.99 um std dev on taps 101-200).
#   [ ] Calibrate Sherpa Mini extruder ([extruder2]): verify motor
#       direction (dir_pin), confirm gear_ratio (50:10 vs 50:8), and
#       run 100mm E-step rotation_distance calibration.
#   [ ] Add the support brace across the back of T2 (cyan).
#   [ ] Mount T2 dock and calibrate dock park coordinates (params_park_x/y/z).
#   [ ] Re-measure Nudge [_CALIBRATION_SWITCH] X/Y/Z position in
#       toolchanger-config.cfg (Nudge mount position moved slightly).
#   [ ] Calibrate [tool_probe T2] z_offset and tool X/Y/Z offsets
#       relative to T0 via Nudge.
#   [ ] Run per-tool Input Shaper calibration using [adxl345 T2].
# =====================================================================

[mcu cyan]
canbus_uuid: 108d45e46fd2

[temperature_sensor cyan_MCU]
sensor_type: temperature_mcu
sensor_mcu: cyan

[neopixel cyan_leds]
pin: cyan:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.5
initial_BLUE: 0.5
initial_WHITE: 0.0

[adxl345 T2]
cs_pin: cyan:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[extruder2]
step_pin: cyan:PD0
dir_pin: !cyan:PD1
enable_pin: !cyan:PD2
microsteps: 16
gear_ratio: 50:10
full_steps_per_rotation: 200
rotation_distance: 22.67895
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: cyan:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: cyan:PA3
control: pid
pid_Kp: 40.092
pid_Ki: 13.364
pid_Kd: 30.069
min_temp: 0
max_temp: 300
max_extrude_only_distance: 120
pressure_advance: 0.03
max_extrude_cross_section: 5

[tmc2209 extruder2]
uart_pin: cyan:PA15
run_current: 0.600
stealthchop_threshold: 0

[fan_generic cyan_partfan]
# Print cooling fan (EBB36 FAN1)
pin: cyan:PA0
kick_start_time: 0.5
off_below: 0.10

[heater_fan cyan_hotend_fan]
# Hotend heatsink fan (EBB36 FAN2)
pin: cyan:PA1
heater: extruder2
heater_temp: 50.0

#####################################################################
#   Probe (OptoTap)
#####################################################################

[tool_probe T2]
pin: ^cyan:PB6
tool: 2
x_offset: 0
y_offset: 0
speed: 8.0
lift_speed: 35.0
z_offset: 0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.020
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder2

#####################################################################
#   Toolchanger Definition
#####################################################################

[gcode_macro T2]
variable_color: ""
gcode:
  SELECT_TOOL T=2

[tool T2]
tool_number: 2
extruder: extruder2
fan: cyan_partfan
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
params_park_x: 175
params_park_y: 2
params_park_z: 298
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 60.0
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 70.0
params_input_shaper_damping_ratio_y: 0.01
