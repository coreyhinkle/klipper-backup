# T2 (Cyan) - Dragon Burner on BIGTREETECH EBB36 v1.2 (STM32G0B1)
# Firmware: Katapult (8KiB, CAN PB0/PB1 @ 1Mbps) + Klipper (8KiB offset, CAN PB0/PB1 @ 1Mbps)
# Pin reference: ~/klipper/config/sample-bigtreetech-ebb-canbus-v1.2.cfg
#
# BRING-UP STAGE: heater, extruder, probe and [tool T2] are intentionally NOT defined yet.

[mcu cyan]
canbus_uuid: 108d45e46fd2

[temperature_sensor cyan_MCU]
sensor_type: temperature_mcu
sensor_mcu: cyan

[fan_generic cyan_partfan]
# Print cooling fan (EBB36 FAN1)
pin: cyan:PA0
kick_start_time: 0.5
off_below: 0.10

# TEMPORARY read-only TH0 check (no heater). Moves into [extruder2] once verified.
[temperature_sensor cyan_hotend]
sensor_type: Generic 3950
sensor_pin: cyan:PA3

# TEMPORARY for bring-up testing. Convert to [heater_fan cyan_hotend_fan]
# (heater: extruder2, heater_temp: 50) when the extruder section is added.
[fan_generic cyan_hotend_fan]
# Hotend heatsink fan (EBB36 FAN2)
pin: cyan:PA1
