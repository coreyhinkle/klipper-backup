# T2 - Dragon Burner on BIGTREETECH EBB36 v1.2 (STM32G0B1 + MAX31865)
# Firmware: Katapult (8KiB, CAN PB0/PB1 @ 1Mbps) + Klipper (8KiB offset, CAN PB0/PB1 @ 1Mbps)
# Pin reference: ~/klipper/config/sample-bigtreetech-ebb-canbus-v1.2.cfg
#
# BRING-UP STAGE: heater, extruder, probe and [tool T2] are intentionally NOT defined yet.

[mcu T2]
canbus_uuid: 108d45e46fd2

[temperature_sensor T2_MCU]
sensor_type: temperature_mcu
sensor_mcu: T2

[fan_generic T2_partfan]
# Print cooling fan (EBB36 FAN1)
pin: T2:PA0
kick_start_time: 0.5
off_below: 0.10

# TEMPORARY read-only RTD check (no heater). Moves into [extruder2] once verified.
# 1000/4300 is ratio-identical to 100/430, so this is correct for either PT100 or
# PT1000 as long as the board DIP switches match the sensor.
[temperature_sensor T2_hotend]
sensor_type: MAX31865
sensor_pin: T2:PA4
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2

# TEMPORARY for bring-up testing. Convert to [heater_fan T2_hotend_fan]
# (heater: extruder2, heater_temp: 50) when the extruder section is added.
[fan_generic T2_hotend_fan]
# Hotend heatsink fan (EBB36 FAN2)
pin: T2:PA1
