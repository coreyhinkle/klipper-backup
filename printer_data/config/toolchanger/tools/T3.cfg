# T3 (Magenta) - Dragon Burner on BIGTREETECH EBB36 v1.2 (STM32G0B1)
# Firmware: Katapult (8KiB, CAN PB0/PB1 @ 1Mbps) + Klipper (8KiB offset, CAN PB0/PB1 @ 1Mbps)
# Pin reference: ~/klipper/config/sample-bigtreetech-ebb-canbus-v1.2.cfg
#
# BARE-BOARD CAN TEST: Active bare-board verification (MCU, temp, NeoPixels, ADXL345).
#
# Staged Dock Measurement (2026-11-27):
#   First-trigger OptoTap jog position (empty shuttle seated in Magenta dock before DragonBurner install):
#     params_park_x: 200.0
#     params_park_y: 3.4
#     params_park_z: 292.7
#   Note: Preliminary reference only — re-verify X/Y/Z once DragonBurner backplate & hotend are mounted.

[mcu magenta]
canbus_uuid: fc8da1eddec9

[temperature_sensor magenta_MCU]
sensor_type: temperature_mcu
sensor_mcu: magenta

[neopixel magenta_leds]
pin: magenta:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.5
initial_WHITE: 0.0

[adxl345 T3]
cs_pin: magenta:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z
