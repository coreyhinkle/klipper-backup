# T3 (Magenta) - Dragon Burner on BIGTREETECH EBB36 v1.2 (STM32G0B1)
# Firmware: Katapult (8KiB, CAN PB0/PB1 @ 1Mbps) + Klipper (8KiB offset, CAN PB0/PB1 @ 1Mbps)
# Pin reference: ~/klipper/config/sample-bigtreetech-ebb-canbus-v1.2.cfg
#
# BARE-BOARD CAN TEST: Only onboard MCU temp sensor and onboard ADXL345 are enabled.
# Heater, thermistor, fans, extruder, and OptoTap probe are not connected yet.

[mcu magenta]
canbus_uuid: ce0655e3d001

[temperature_sensor magenta_MCU]
sensor_type: temperature_mcu
sensor_mcu: magenta

[adxl345 T3]
cs_pin: magenta:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z
