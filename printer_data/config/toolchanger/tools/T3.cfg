# T3 (Magenta) - Dragon Burner on BIGTREETECH EBB36 v1.2 (STM32G0B1)
# Firmware: Katapult (8KiB, CAN PB0/PB1 @ 1Mbps) + Klipper (8KiB offset, CAN PB0/PB1 @ 1Mbps)
# Pin reference: ~/klipper/config/sample-bigtreetech-ebb-canbus-v1.2.cfg
#
# =====================================================================
# TODO BEFORE PRINTING WITH T3 (MAGENTA):
#   [ ] Verify [extruder3] thermistor type (provisional ATC Semitec 104NT-4-R025H42G on PA3).
#   [ ] Run PID calibration on [extruder3]: PID_CALIBRATE HEATER=extruder3 TARGET=240
#       (currently using placeholder PID values; do NOT print before tuning).
#   [ ] Calibrate Sherpa Mini RIDGA/IDGA ([extruder3]): verify dir_pin (!magenta:PD1 vs magenta:PD1),
#       confirm pinion gear_ratio (50:10 vs 50:8), and run 100mm rotation_distance calibration.
#   [ ] Test [fan_generic magenta_partfan] (PA0) and [heater_fan magenta_hotend_fan] (PA1).
#   [ ] Verify [tool_probe T3] (^magenta:PB6) toggles open (0) on shuttle and triggered (1) in dock;
#       run OptoTap break-in/repeatability test (PROBE_ACCURACY).
#   [ ] Verify Comp057 compensated backplate fitment & refine dock park coordinates:
#       currently provisional OptoTap first-trigger ref (200.0, 3.4, 292.7).
#   [ ] Calibrate [adxl345 T3] input shaper and [tool T3] X/Y/Z offsets relative to T0 via Nudge.
# =====================================================================

[mcu magenta]
canbus_uuid: fc8da1eddec9

[temperature_sensor magenta_MCU]
sensor_type: temperature_mcu
sensor_mcu: magenta

[neopixel magenta_leds]
pin: magenta:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.5
initial_GREEN: 0.0
initial_BLUE: 0.5
initial_WHITE: 0.0

[adxl345 T3]
cs_pin: magenta:PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

#####################################################################
#   Extruder ([extruder3] - Sherpa Mini w/ RIDGA/IDGA, Provisional)
#####################################################################

[extruder3]
step_pin: magenta:PD0
dir_pin: !magenta:PD1
enable_pin: !magenta:PD2
microsteps: 16
gear_ratio: 50:10
full_steps_per_rotation: 200
rotation_distance: 22.67895
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: magenta:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: magenta:PA3
control: pid
pid_Kp: 40.092
pid_Ki: 13.364
pid_Kd: 30.069
min_temp: 0
max_temp: 300
max_extrude_only_distance: 120
pressure_advance: 0.03
max_extrude_cross_section: 5

[tmc2209 extruder3]
uart_pin: magenta:PA15
run_current: 0.600
stealthchop_threshold: 0

#####################################################################
#   Fans
#####################################################################

[fan_generic magenta_partfan]
# Print cooling fan (EBB36 FAN1)
pin: magenta:PA0
kick_start_time: 0.5
off_below: 0.10

[heater_fan magenta_hotend_fan]
# Hotend heatsink fan (EBB36 FAN2)
pin: magenta:PA1
heater: extruder3
heater_temp: 50.0

#####################################################################
#   Probe (OptoTap)
#####################################################################

[tool_probe T3]
pin: ^magenta:PB6
tool: 3
x_offset: 0
y_offset: 0
speed: 8.0
lift_speed: 35.0
z_offset: 0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.020
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder3

#####################################################################
#   Toolchanger Definition
#####################################################################

[gcode_macro T3]
variable_color: ""
gcode:
  SELECT_TOOL T=3

[tool T3]
tool_number: 3
extruder: extruder3
fan: magenta_partfan
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
params_park_x: 200.0
params_park_y: 3.4
params_park_z: 292.7
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 60.0
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 70.0
params_input_shaper_damping_ratio_y: 0.01
