# This file contains common pin mappings for the BIGTREETECH green (EBBCan)
# Canbus board. To use this config, the firmware should be compiled for the
# RP2040 with "USB" or "CAN bus (on gpio4/gpio5)".
# The "green" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[include ../../stealthburner_leds_green.cfg]
[mcu green]
#serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: a7f6c7cc913a

[temperature_sensor green_EBB_NTC]
sensor_type: Generic 3950
sensor_pin: green:gpio28

[adxl345 T1]
cs_pin: green:gpio1
spi_software_sclk_pin: green:gpio2
spi_software_mosi_pin: green:gpio0
spi_software_miso_pin: green:gpio3
axes_map: z,-y,x

[extruder1]
step_pin: green:gpio18
dir_pin: green:gpio19
enable_pin: !green:gpio17
microsteps: 16
gear_ratio: 50:10
full_steps_per_rotation: 200
rotation_distance: 22.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: green:gpio7
control: pid
min_temp: 0
max_temp: 260
max_extrude_only_distance: 120
# Got from pattern here: https://ellis3dp.com/Print-Tuning-Guide/articles/index_pressure_advance.html
pressure_advance: 0.04
# Needed for KAMP purge
max_extrude_cross_section: 5
pid_kp: 16.934
pid_ki: 0.918
pid_kd: 78.107

sensor_type: MAX31865
sensor_pin: green:gpio9
spi_software_sclk_pin: green:gpio10
spi_software_mosi_pin: green:gpio8
spi_software_miso_pin: green:gpio11
rtd_nominal_r: 100
rtd_reference_r: 430
rtd_num_of_wires: 2

[tmc2209 extruder1]
uart_pin: green:gpio20
run_current: 0.650

[fan_generic T1_partfan]
# Print cooling fan
pin: green:gpio13
kick_start_time: 0.5
off_below: 0.10

[heater_fan T1_hotend_fan]
pin: green:gpio14
heater: extruder1
heater_temp: 50

#Change tool number if needed in the next line, as well ast the last line
[gcode_macro T1]
variable_color: ""
gcode:
  SELECT_TOOL T=1

[tool T1]
#change this too
tool_number: 1
#if this were T1, then this would be extruder1, etc
extruder: extruder1
#Change T0_partfan to tool number
fan: T1_partfan
gcode_x_offset: 0.2750
gcode_y_offset: 0.1609
gcode_z_offset: 0.0394
#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 4
params_park_y: 2
params_park_z: 299
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 60.1
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 72.3
params_input_shaper_damping_ratio_y: 0.01  

#####################################################################
# 	Probe
#####################################################################

[tool_probe T1]
##	Inductive Probe
##	This probe is not used for Z height, only Quad Gantry Leveling
##  NPN and PNP proximity switch types can be set by jumper
pin: ^green:gpio22
tool: 1
x_offset: 0
y_offset: 0
speed: 8.0
lift_speed: 35.0
z_offset: 0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.020
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder1
   
